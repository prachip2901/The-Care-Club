{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Login Form</title>

    <!-- Font Icon -->
    <link rel="stylesheet" href="{% static 'fonts/material-icon/css/material-design-iconic-font.min.css' %}">

    <!-- Main css -->
    <link rel="stylesheet" href="{% static 'css/reg_style.css' %}">
    <link rel="stylesheet" href="{% static 'popup.css' %}">

    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
 
    <!-- <link href="{% static 'css/style.css' %}" rel="stylesheet"> -->
   
</head>

<body class="admin-login-page">
    <div class="main">

        <!-- Sing in  Form -->
        <section class="sign-in">
            <div class="container">
                <div class="signin-content">
                    <div class="signin-image">
                        <figure><img src="{% static 'img/signin-image.jpg' %}" alt="sing up image"></figure><br/>
                        <div class="signin-quick-links">
                            <a href="{% url 'userindex' %}" class="signup-image-link login-link-btn login-link-home">Home Page</a>
                            <a href="{% url 'login' %}" class="signup-image-link login-link-btn login-link-switch">Member Login</a>
                        </div>
                    </div>

                    <div class="signin-form">
                        <span class="login-badge">HopeBridge Admin</span>
                        <h2 class="form-title">Admin Login</h2>
                        <p class="login-subtitle">Secure access for approvals, members, and donation management.</p>
                        <form method="POST" class="register-form" id="login-form">
                            {% csrf_token %}
                            <div class="form-group login-field">
                                <label class="field-label" for="your_email">Username</label>
                           
                                <input type="text" name="name" id="your_email" placeholder="e.g. admin" value="{{ name }}" required/>
                            </div>
                            <div class="form-group login-field">
                                <label class="field-label" for="password">Password</label>
                               
                                <input type="password" name="password" id="password" placeholder="Your password" required/>
                            </div>
                            <div class="form-group form-button">
                                <input type="submit" id="signin" class="form-submit" value="Log in"/>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            {% if m %}
            <script>alert("{{m}}")</script>
            {% endif %}
        </section>

    </div>

    <!--===== POP UP====-->
    <!-- The Modal -->
	<div id="myModal" class="modal">

  
        <script>
        // Get the modal
        var modal = document.getElementById("myModal");
  
        // Get the button that opens the modal
         var btn = document.getElementById("myBtn1");
  
        // Get the <span> element that closes the modal
        document.querySelector('.close').addEventListener('click',function(){
            modal.style.display = "none";
        });
  
        // When the user clicks the button, open the modal 
        btn.onclick = function() {
            modal.style.display = "block";
        }
  
        // When the user clicks on <span> (x), close the modal
        span.onclick = function() {
            modal.style.display = "none";
        }
  
        // When the user clicks anywhere outside of the modal, close it
        window.onclick = function(event) {
        if (event.target == modal) {
            modal.style.display = "none";
        }
        }
        </script>
    </div>
    <!-- JS -->
    <script src="{% static 'vendor/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'js/reg_main.js' %}"></script>
</body>
</html>
